<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" class="boss-art" role="img" aria-label="lord-of-busywork"><style>/* ---------- boss art ---------- */ .lair { position: relative; animation: emerge 1.1s cubic-bezier(0.2, 0.8, 0.2, 1); } .lair-btn { display: block; width: 100%; overflow: hidden; border-radius: 12px; cursor: pointer; } .boss-art { display: block; width: 100%; height: auto; } .boss-art .bob, .boss-art .jaw, .boss-art .eyes, .boss-art .smoke { transform-box: fill-box; } .boss-art .bob { transform-origin: 50% 90%; animation: bob 4.6s ease-in-out infinite; } .boss-art .jaw { transform-origin: 50% 0; animation: jaw 7s ease-in-out infinite; } .boss-art .maw { opacity: 0.35; animation: maw 7s ease-in-out infinite; } .boss-art .eyes { transform-origin: center; animation: blink 5.5s infinite; } .boss-art .halo { opacity: 0.5; animation: halo 2.2s ease-in-out infinite alternate; } .boss-art .smoke { fill: rgb(200 190 180 / 0.5); transform-origin: center; opacity: 0; animation: smoke 3.2s ease-out infinite; } .boss-art .fog ellipse { fill: rgb(255 255 255 / 0.07); animation: drift 9s ease-in-out infinite alternate; } .boss-art .ember { fill: #ffb347; opacity: 0; animation: emberUp 4.2s linear infinite; } .boss-art .cracks, .boss-art .lair-glow { opacity: 0; transition: opacity 0.8s; } .boss-art.enraged .cracks { opacity: 1; animation: halo 0.9s ease-in-out infinite alternate; } .boss-art.enraged .lair-glow { opacity: 1; animation: halo 1.4s ease-in-out infinite alternate; } .boss-art.enraged .eye, .boss-art.enraged .halo { fill: #ff3b2f; } .boss-art.enraged .bob { animation-duration: 2.2s; } .boss-art.enraged .jaw, .boss-art.enraged .maw { animation-duration: 3.4s; } .boss-art.roaring .jaw { animation: jawNow 1.1s ease-out; } .boss-art.roaring .maw { animation: mawNow 1.1s ease-out; } .boss-art.roaring .bob { animation: shakeHead 1.1s ease-out; } .boss-art.hit { animation: bossHit 0.55s ease-out; } @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-1.5deg); } } @keyframes jaw { 0%, 68%, 100% { transform: none; } 74%, 88% { transform: translateY(9px) scaleY(1.06); } } @keyframes maw { 0%, 68%, 100% { opacity: 0.35; } 74%, 88% { opacity: 1; } } @keyframes halo { from { opacity: 0.35; } to { opacity: 0.85; } } @keyframes smoke { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 0.6; } 100% { opacity: 0; transform: translate(var(--sx, 0), 6px) scale(2.8); } } @keyframes drift { to { transform: translateX(18px); } } @keyframes emberUp { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 0.9; } 100% { opacity: 0; transform: translate(8px, -120px); } }</style><defs><radialGradient id="lairR0" cx="50%" cy="100%" r="90%"><stop offset="0" stop-color="#1c1438"></stop><stop offset="1" stop-color="#09070a"></stop></radialGradient><radialGradient id="rageR0" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#ff3b1f" stop-opacity="0.55"></stop><stop offset="1" stop-color="#ff3b1f" stop-opacity="0"></stop></radialGradient><linearGradient id="bodyR0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2d68"></stop><stop offset="1" stop-color="#120c22"></stop></linearGradient><linearGradient id="hornR0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6d6150"></stop><stop offset="1" stop-color="#efe4cc"></stop></linearGradient><linearGradient id="eyeR0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8fbff"></stop><stop offset="1" stop-color="#3fa9ff"></stop></linearGradient><radialGradient id="mawR0" cx="50%" cy="80%" r="70%"><stop offset="0" stop-color="#ffb347"></stop><stop offset="0.45" stop-color="#d2361b"></stop><stop offset="1" stop-color="#2a0505"></stop></radialGradient><linearGradient id="fadeR0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09070a" stop-opacity="0"></stop><stop offset="1" stop-color="#09070a"></stop></linearGradient><filter id="glowR0" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><filter id="blurR0" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter></defs><rect width="240" height="170" fill="url(#lairR0)"></rect><ellipse class="lair-glow" cx="120" cy="170" rx="150" ry="90" fill="url(#rageR0)"></ellipse><circle class="ember" cx="30" cy="160" r="1.3" style="animation-delay:0s"></circle><circle class="ember" cx="70" cy="160" r="1.3" style="animation-delay:1.4s"></circle><circle class="ember" cx="104" cy="160" r="1.3" style="animation-delay:2.6s"></circle><circle class="ember" cx="150" cy="160" r="1.3" style="animation-delay:0.7s"></circle><circle class="ember" cx="188" cy="160" r="1.3" style="animation-delay:2s"></circle><circle class="ember" cx="214" cy="160" r="1.3" style="animation-delay:3.1s"></circle><g transform="translate(120 96) rotate(0) scale(0.9)"><path d="M-30 30 C-34 70 -40 100 -52 130 L52 130 C40 100 34 70 30 30 Z" fill="url(#bodyR0)"></path><g fill="none" stroke="#6a52b0" stroke-opacity="0.5" stroke-width="1.5"><path d="M-24 66 Q0 76 24 66"></path><path d="M-27 84 Q0 95 27 84"></path><path d="M-31 102 Q0 114 31 102"></path></g><g class="bob" style="animation-delay:0s"><path d="M-26 -38 C-46 -48 -60 -70 -52 -92 C-44 -74 -32 -62 -12 -50 Z" fill="url(#hornR0)"></path><path d="M26 -38 C46 -48 60 -70 52 -92 C44 -74 32 -62 12 -50 Z" fill="url(#hornR0)"></path><path d="M-50 -4 L-74 4 L-50 12 Z M-46 14 L-66 28 L-40 24 Z" fill="url(#bodyR0)" stroke="#6a52b0" stroke-width="1"></path><path d="M50 -4 L74 4 L50 12 Z M46 14 L66 28 L40 24 Z" fill="url(#bodyR0)" stroke="#6a52b0" stroke-width="1"></path><path class="maw" d="M-26 35 L0 40 L26 35 L20 58 L0 66 L-20 58 Z" fill="url(#mawR0)"></path><g class="jaw" style="animation-delay:0s"><path d="M-27 37 C-22 50 -10 60 0 66 C10 60 22 50 27 37 L16 42 L0 46 L-16 42 Z" fill="url(#bodyR0)" stroke="#6a52b0" stroke-width="1.2"></path><path d="M-15 43 l3 -7 l3 7 Z M9 43 l3 -7 l3 7 Z M-3 46 l3 -6 l3 6 Z" fill="#efe4cc"></path></g><path d="M0 -50 C30 -50 50 -30 52 -5 C54 12 42 26 28 36 L0 40 L-28 36 C-42 26 -54 12 -52 -5 C-50 -30 -30 -50 0 -50 Z" fill="url(#bodyR0)" stroke="#6a52b0" stroke-width="1.6"></path><g fill="none" stroke="#6a52b0" stroke-width="1.3" stroke-opacity="0.8"><path d="M-16 -36 Q-8 -29 0 -36 Q8 -29 16 -36"></path><path d="M-11 -25 Q-5 -19 0 -25 Q5 -19 11 -25"></path><path d="M0 -14 V14" stroke-opacity="0.4"></path></g><g class="cracks" fill="none" stroke="#ff7a1f" stroke-width="1.6" stroke-linecap="round"><path d="M-12 -46 L-6 -34 L-14 -24 L-8 -14"></path><path d="M20 -40 L14 -28 L22 -18"></path><path d="M-34 18 L-24 22 L-28 30"></path></g><path d="M-24 35 l3 9 l3 -8 Z M-14 37 l3 10 l3 -9 Z M8 38 l3 9 l3 -10 Z M18 36 l3 8 l3 -9 Z" fill="#efe4cc"></path><ellipse class="halo" cx="-22" cy="5" rx="17" ry="9" fill="url(#eyeR0)" filter="url(#blurR0)"></ellipse><ellipse class="halo" cx="22" cy="5" rx="17" ry="9" fill="url(#eyeR0)" filter="url(#blurR0)"></ellipse><g class="eyes" filter="url(#glowR0)"><path class="eye" d="M-37 -4 L-9 3 L-15 12 L-32 9 Z" fill="url(#eyeR0)"></path><path class="eye" d="M37 -4 L9 3 L15 12 L32 9 Z" fill="url(#eyeR0)"></path><ellipse cx="-22" cy="5" rx="1.7" ry="5" fill="#120505"></ellipse><ellipse cx="22" cy="5" rx="1.7" ry="5" fill="#120505"></ellipse></g><path d="M-42 -16 L-5 -5 L-7 2 L-42 -7 Z M42 -16 L5 -5 L7 2 L42 -7 Z" fill="#0b0608"></path><path d="M-7 25 l-5 -5 M7 25 l5 -5" stroke="#0b0608" stroke-width="2.4" stroke-linecap="round"></path><circle class="smoke" cx="-10" cy="22" r="3.5" style="animation-delay:0s;--sx:-22px"></circle><circle class="smoke" cx="10" cy="22" r="3.5" style="animation-delay:-1.6s;--sx:22px"></circle><g><path d="M-26 -44 L-22 -68 L-11 -54 L0 -76 L11 -54 L22 -68 L26 -44 Z" fill="#e3b341" stroke="#8a6414" stroke-width="1.2"></path><circle cx="0" cy="-54" r="3.4" fill="#ff4d6d"></circle></g></g></g><rect y="118" width="240" height="52" fill="url(#fadeR0)"></rect><g class="fog"><ellipse cx="50" cy="162" rx="70" ry="12"></ellipse><ellipse cx="180" cy="166" rx="80" ry="12" style="animation-delay:-4s"></ellipse><ellipse cx="120" cy="170" rx="90" ry="10" style="animation-delay:-2s"></ellipse></g></svg>